<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <!-- Paragrafo 3.9 (nuovo): riflessione e rifrazione aria → vetro, θ1 = 45°, θ2 ≈ 28,1° (sin θ2 = sin 45° / 1,5) -->
  <defs>
    <marker id="fb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2d6ca8"/></marker>
    <marker id="fo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#e08a00"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2d9e5b"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="339" height="229" rx="8" fill="#ffffff" stroke="#dde4eb"/>
  <!-- vetro -->
  <rect x="12" y="115" width="316" height="105" fill="#e6eff8"/>
  <line x1="12" y1="115" x2="328" y2="115" stroke="#0f2c4a" stroke-width="1.5"/>
  <text x="20" y="24" font-size="12" fill="#0f2c4a">aria · n₁ = 1</text>
  <text x="20" y="138" font-size="12" fill="#0f2c4a">vetro · n₂ = 1,5</text>
  <!-- normale -->
  <line x1="170" y1="22" x2="170" y2="195" stroke="#8a96a3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="176" y="30" font-size="11" fill="#56626f">normale</text>
  <!-- raggi -->
  <polyline points="106.4,51.4 138.2,83.2 170,115" fill="none" stroke="#2d6ca8" stroke-width="2.2" marker-mid="url(#fb)"/>
  <polyline points="170,115 201.8,83.2 233.6,51.4" fill="none" stroke="#e08a00" stroke-width="2.2" marker-mid="url(#fo)"/>
  <polyline points="170,115 188.9,150.3 207.7,185.6" fill="none" stroke="#2d9e5b" stroke-width="2.2" marker-mid="url(#fg)"/>
  <text x="100" y="66" font-size="11" fill="#2d6ca8" text-anchor="end">incidente</text>
  <text x="238" y="47" font-size="11" fill="#b06a00">riflesso</text>
  <text x="213" y="186" font-size="11" fill="#1f7a45">rifratto</text>
  <!-- angoli -->
  <path d="M170,85 A30,30 0 0 0 148.8,93.8" fill="none" stroke="#0f2c4a" stroke-width="1"/>
  <path d="M170,85 A30,30 0 0 1 191.2,93.8" fill="none" stroke="#0f2c4a" stroke-width="1"/>
  <path d="M170,145 A30,30 0 0 0 184.1,141.5" fill="none" stroke="#0f2c4a" stroke-width="1"/>
  <text x="152" y="70" font-size="11" fill="#0f2c4a" text-anchor="middle">45°</text>
  <text x="188" y="70" font-size="11" fill="#0f2c4a" text-anchor="middle">45°</text>
  <text x="185" y="173" font-size="11" fill="#0f2c4a" text-anchor="middle">28°</text>
  <text x="322" y="212" font-size="11" fill="#0f2c4a" text-anchor="end">1 · sin 45° = 1,5 · sin θ₂ → θ₂ ≈ 28°</text>
</svg>
