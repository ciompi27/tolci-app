<style>

<body>
<div class="wrap">
<header><h1>Logica per il TOLC-I</h1><p>Implicazioni, condizioni, quantificatori e sillogismi.</p>
<div class="modes" role="tablist"><button class="modetab" role="tab" data-mode="learn" aria-selected="true">Impara</button><button class="modetab" role="tab" data-mode="practice" aria-selected="false">Allenati</button></div></header>
<main id="main"></main>
</div>
<script>
"use strict";
/* ================= UTILITÀ ================= */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const low=s=>s.charAt(0).toLowerCase()+s.slice(1);
const OPT={patto:true};

/* ================= FRASI PER IMPLICAZIONE E CONDIZIONI =================
   Ogni coppia è un'implicazione A ⇒ B realistica. ce = esempio di "B vera, A falsa". */
function C(subj,vi,vc){const s=subj?subj+' ':'';return{i:s+vi,c:s+vc,ni:s+'non '+vi,nc:s+'non '+vc};}
const PAIRS=[
 {a:C('','piove','piova'),b:C('la strada','è bagnata','sia bagnata'),ce:'è passata l’autobotte: la strada è bagnata ma non piove'},
 {a:C('il triangolo','è equilatero','sia equilatero'),b:C('il triangolo','è isoscele','sia isoscele'),ce:'un triangolo con due soli lati uguali è isoscele ma non equilatero'},
 {a:C('il quadrilatero','è un quadrato','sia un quadrato'),b:C('il quadrilatero','è un rettangolo','sia un rettangolo'),ce:'un rettangolo con lati 3 e 5 non è un quadrato'},
 {a:C('Luca','vive a Bologna','viva a Bologna'),b:C('Luca','vive in Emilia-Romagna','viva in Emilia-Romagna'),ce:'Luca vive a Modena: in Emilia-Romagna, ma non a Bologna'},
 {a:C('Marco','è a Parigi','sia a Parigi'),b:C('Marco','è in Francia','sia in Francia'),ce:'Marco è a Lione: in Francia, ma non a Parigi'},
 {a:C('il numero','termina con 0','termini con 0'),b:C('il numero','è divisibile per 5','sia divisibile per 5'),ce:'il numero 15 è divisibile per 5 ma non termina con 0'},
 {a:C('il numero','è divisibile per 4','sia divisibile per 4'),b:C('il numero','è pari','sia pari'),ce:'il numero 6 è pari ma non è divisibile per 4'},
 {a:C('il numero','è multiplo di 9','sia multiplo di 9'),b:C('il numero','è multiplo di 3','sia multiplo di 3'),ce:'il numero 12 è multiplo di 3 ma non di 9'},
 {a:C('l’acqua','bolle','bolla'),b:C('l’acqua','è calda','sia calda'),ce:'l’acqua a 60 °C è calda ma non bolle'},
 {a:C('Sara','ha la patente B','abbia la patente B'),b:C('Sara','è maggiorenne','sia maggiorenne'),ce:'Sara ha 20 anni ma non ha mai preso la patente'},
 {a:C('Anna','vince la gara','vinca la gara'),b:C('Anna','partecipa alla gara','partecipi alla gara'),ce:'Anna partecipa alla gara ma arriva terza'},
 {a:C('Giulia','supera l’esame','superi l’esame'),b:C('Giulia','è iscritta all’esame','sia iscritta all’esame'),ce:'Giulia è iscritta all’esame ma non lo supera'},
 {a:C('il telefono','squilla','squilli'),b:C('il telefono','è acceso','sia acceso'),ce:'il telefono è acceso ma nessuno chiama'},
 {a:C('la lampadina','è accesa','sia accesa'),b:C('','c’è corrente','ci sia corrente'),ce:'c’è corrente ma l’interruttore è spento'},
 {a:C('il cantiere','è aperto','sia aperto'),b:C('il permesso di costruire','è stato rilasciato','sia stato rilasciato'),ce:'il permesso è stato rilasciato ma i lavori non sono ancora iniziati'},
 {a:C('la trave','è in acciaio','sia in acciaio'),b:C('la trave','è metallica','sia metallica'),ce:'una trave in alluminio è metallica ma non in acciaio'},
 {a:C('Fido','è un cane','sia un cane'),b:C('Fido','è un mammifero','sia un mammifero'),ce:'Fido è un gatto: un mammifero, ma non un cane'},
 {a:C('il frigorifero','funziona','funzioni'),b:C('il frigorifero','è collegato alla corrente','sia collegato alla corrente'),ce:'il frigorifero è collegato ma è guasto'},
 {a:C('il treno','parte','parta'),b:C('il macchinista','è a bordo','sia a bordo'),ce:'il macchinista è a bordo ma il treno è fermo per un guasto'},
 {a:C('Paolo','entra in palestra','entri in palestra'),b:C('Paolo','ha l’abbonamento','abbia l’abbonamento'),ce:'Paolo ha l’abbonamento ma oggi resta a casa'},
 {a:C('la piscina','è aperta','sia aperta'),b:C('il bagnino','è presente','sia presente'),ce:'il bagnino è presente per le pulizie, a piscina chiusa'},
 {a:C('Chiara','è nata a Napoli','sia nata a Napoli'),b:C('Chiara','è nata in Italia','sia nata in Italia'),ce:'Chiara è nata a Torino'},
 {a:C('la caldaia','è accesa','sia accesa'),b:C('il gas','arriva alla caldaia','arrivi alla caldaia'),ce:'il gas arriva ma la caldaia è spenta'},
 {a:C('Davide','guida l’auto','guidi l’auto'),b:C('Davide','ha le chiavi dell’auto','abbia le chiavi dell’auto'),ce:'Davide ha le chiavi ma oggi va a piedi'},
 {a:C('il cellulare','si carica','si carichi'),b:C('il caricabatterie','è collegato','sia collegato'),ce:'il caricabatterie è collegato ma la batteria è già piena'},
 {a:C('Tommaso','abita a Milano','abiti a Milano'),b:C('Tommaso','abita in Lombardia','abiti in Lombardia'),ce:'Tommaso abita a Bergamo'},
 {a:C('il negozio','accetta la carta','accetti la carta'),b:C('il negozio','ha il POS','abbia il POS'),ce:'il negozio ha il POS ma oggi è guasto'},
 {a:C('','è domenica','sia domenica'),b:C('la scuola','è chiusa','sia chiusa'),ce:'in un giorno di festa infrasettimanale la scuola è chiusa ma non è domenica'},
];

/* ================= LOGICA PROPOSIZIONALE (tavole di verità) ================= */
const WORLDS=[{A:true,B:true},{A:true,B:false},{A:false,B:true},{A:false,B:false}];
const L=(v,n=false)=>({v,n});
const imp=(x,y)=>({t:'imp',x,y}), iff=(x,y)=>({t:'iff',x,y}), and=(x,y)=>({t:'and',x,y});
const evL=(l,w)=>l.n?!w[l.v]:w[l.v];
function ev(f,w){const a=evL(f.x,w),b=evL(f.y,w);return f.t==='imp'?(!a||b):f.t==='iff'?(a===b):(a&&b);}
const tab=f=>WORLDS.map(w=>ev(f,w));
const sameTab=(f,g)=>{const a=tab(f),b=tab(g);return a.every((v,i)=>v===b[i]);};
const entails=(f,g)=>{const a=tab(f),b=tab(g);return a.every((v,i)=>!v||b[i]);};
const isNeg=(f,g)=>{const a=tab(f),b=tab(g);return a.every((v,i)=>v!==b[i]);};
const symL=l=>(l.n?'¬':'')+l.v;
const sym=f=>symL(f.x)+(f.t==='imp'?' ⇒ ':f.t==='iff'?' ⇔ ':' e ')+symL(f.y);
function clauseOf(p,l){const c=l.v==='A'?p.a:p.b;return l.n?{i:c.ni,c:c.nc}:{i:c.i,c:c.c};}
function fText(p,f){const x=clauseOf(p,f.x).i,y=clauseOf(p,f.y).i;
 if(f.t==='imp')return `Se ${x}, ${y}.`;
 if(f.t==='iff')return `${cap(x)} se e solo se ${y}.`;
 return `${cap(x)} e ${y}.`;}
const worldTxt=(p,w)=>`${w.A?p.a.i:p.a.ni} e ${w.B?p.b.i:p.b.ni}`;
const worldFull=(p,w)=>worldTxt(p,w)+(!w.A&&w.B?` (per esempio: ${p.ce})`:'');
const worldSym=w=>`A ${w.A?'vera':'falsa'} e B ${w.B?'vera':'falsa'}`;
const worldRegion=w=>w.A&&w.B?'in':(!w.A&&w.B?'ring':(!w.A&&!w.B?'out':null));
const VF=b=>b?'V':'F';
function truthTable(p,cols){
 let h='<div class="tt-wrap"><table class="tt"><thead><tr><th>A</th><th>B</th>'+cols.map(c=>`<th>${c.h}</th>`).join('')+'</tr></thead><tbody>';
 WORLDS.forEach(w=>{h+=`<tr><td>${VF(w.A)}</td><td>${VF(w.B)}</td>`+cols.map(c=>`<td>${VF(ev(c.f,w))}</td>`).join('')+'</tr>';});
 return h+`</tbody></table></div><p class="small">A = «${p.a.i}», B = «${p.b.i}». V = vera, F = falsa.</p>`;}
const BASE=imp(L('A'),L('B'));

const IMP_ST={
 frase:{name:'la frase stessa',f:imp(L('A'),L('B'))},
 contronominale:{name:'la contronominale',f:imp(L('B',true),L('A',true))},
 inversa:{name:'l’inversa',f:imp(L('B'),L('A'))},
 contraria:{name:'la contraria',f:imp(L('A',true),L('B',true))},
};

/* --- Implicazione 1: quali frasi si deducono --- */
function genImpDeduce(){
 const pi=rnd(PAIRS.length),p=PAIRS[pi],prem=BASE;
 const keys=shuffle(Object.keys(IMP_ST)),R4=['I','II','III','IV'],lab={};
 keys.forEach((k,i)=>lab[k]=R4[i]);
 const ded=keys.filter(k=>entails(prem,IMP_ST[k].f));
 const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
 const setLabel=set=>{const r=set.map(k=>lab[k]).sort((a,b)=>R4.indexOf(a)-R4.indexOf(b));
  if(r.length===4)return 'Tutte e quattro: I, II, III e IV';
  if(r.length===1)return 'Solo '+r[0];

 case 'O':return[`Qualche ${n.s} non ${v[0]}`,`Almeno ${n.un} ${n.s} non ${v[0]}`,`Non tutti ${n.art} ${n.p} ${v[1]}`];}}
const formOfTab=t=>Object.keys(QF).find(k=>tabEq(qTab(QF[k]),t));
function qModelTxt(m,n,v){
 if(m.x&&!m.y)return `tutti ${n.art} ${n.p} ${v[1]}`;
 if(!m.x&&m.y)return `nessun${n.un==='uno'?'o':''} ${n.s} ${v[0]}`;
 if(m.x&&m.y)return `alcuni ${n.p} ${v[1]} e altri no`;
 return `non c’è nessun ${n.s}`;}
const QREL=(o,f)=>{if(o===f)return 'Ripete la frase data con altre parole: non la nega.';
 const s=[o,f].sort().join('');
 if(s==='AE')return 'È il contrario, non la negazione: è troppo forte. Per smentire «tutti» basta un solo controesempio; «nessuno» e «tutti» possono essere false insieme.';
 if(s==='IO')return 'Hai negato solo il verbo lasciando «qualche»: «qualche è» e «qualche non è» possono essere vere insieme.';
 return 'Hai cambiato solo la quantità (tutti/qualche) o solo il verbo: per negare servono entrambe le cose.';};
function genQuant(){
 const ni=rnd(QNOUNS.length),vi=rnd(VERBS.length),n=QNOUNS[ni],v=VERBS[vi];
 const of=pick(['A','A','E','I','O']);const ophr=qPhr(of,n,v),oi=rnd(ophr.length),orig=ophr[oi];
 const oTab=qTab(QF[of]),negTab=oTab.map(b=>!b);
 const base=[];['A','E','I','O'].forEach(f=>qPhr(f,n,v).forEach(t=>base.push({txt:t,tab:qTab(QF[f]),form:f,pre:false})));
 const correct=pick(base.filter(o=>tabEq(o.tab,negTab)));
 const cands=shuffle(base.filter(o=>o.txt!==orig&&!tabEq(o.tab,negTab)));
 const pre=shuffle(base.filter(o=>o.form!==of&&!o.txt.startsWith('Non')).map(o=>({txt:`Non è vero che ${low(o.txt)}`,tab:o.tab.map(b=>!b),form:formOfTab(o.tab.map(b=>!b)),pre:true,inner:o})));
 const chosen=[],seenTab=new Set();
 cands.forEach(o=>{const k=o.tab.join();if(!seenTab.has(k)&&chosen.length<3){chosen.push(o);seenTab.add(k);}});
 for(const o of pre){if(chosen.length>=4)break;if(!tabEq(o.tab,negTab))chosen.push(o);}
 for(const o of cands){if(chosen.length>=4)break;if(!chosen.includes(o))chosen.push(o);}
 const options=shuffle([correct,...chosen]).map(o=>{const ok=tabEq(o.tab,negTab);let why,err=null;
  if(ok)why=`È vera esattamente quando la frase data è falsa. Regola: la negazione di ${QNAME[of]} è ${QNAME[o.form]}.`;
  else{const m=QM.filter(m=>m.x||m.y).find(m=>QF[of](m)===QF[o.form](m));
   why=(o.pre?`«Non è vero che ${low(o.inner.txt)}» equivale a «${qPhr(o.form,n,v)[0]}». `:'')+`Se ${qModelTxt(m,n,v)}, la frase data e questa sono entrambe ${QF[of](m)?'vere':'false'}: una negazione deve avere sempre il valore opposto.`;
   err=QREL(o.form,of);}
  return{html:o.txt+'.',correct:ok,why,err};});
 return{topic:'quant',key:'q'+ni+'-'+vi+of,
  stem:`Qual è la negazione di questa frase?<q class="blockq">${orig}.</q>`,options,
  steps:[`La frase è del tipo ${QNAME[of]}.`,
   `Regola: tutti ⟷ almeno uno non; nessuno ⟷ almeno uno. Negare significa smentire: basta un caso che va contro.`,
   `La frase data è falsa esattamente quando: ${low(correct.txt)}.`,
   `Risposta: <q>${correct.txt}.</q>`],
  fig:{type:'quant',noun:ni,verb:vi,caption:'Prova a cliccare sulle zone per vedere quando ciascuna frase è vera.'}};
}

/* ================= SILLOGISMI (insiemi S, M, P: bit 1, 2, 4) ================= */
const SNOUNS=[N('studente','studenti','gli','uno'),N('ciclista','ciclisti','i','un'),N('musicista','musicisti','i','un'),N('vegetariano','vegetariani','i','un'),N('pendolare','pendolari','i','un'),N('nuotatore','nuotatori','i','un'),N('fotografo','fotografi','i','un'),N('cuoco','cuochi','i','un'),N('pianista','pianisti','i','un'),N('scacchista','scacchisti','gli','uno'),N('escursionista','escursionisti','gli','un'),N('sciatore','sciatori','gli','uno'),N('ballerino','ballerini','i','un'),N('programmatore','programmatori','i','un'),N('pittore','pittori','i','un'),N('giardiniere','giardinieri','i','un'),N('volontario','volontari','i','un'),N('collezionista','collezionisti','i','un'),N('alpinista','alpinisti','gli','un'),N('tennista','tennisti','i','un'),N('chitarrista','chitarristi','i','un'),N('automobilista','automobilisti','gli','un'),N('geometra','geometri','i','un'),N('ingegnere','ingegneri','gli','un'),N('violinista','violinisti','i','un'),N('podista','podisti','i','un'),N('velista','velisti','i','un'),N('fumatore','fumatori','i','un'),N('lettore di gialli','lettori di gialli','i','un'),N('giocatore di basket','giocatori di basket','i','un'),N('tifoso di calcio','tifosi di calcio','i','un'),N('architetto','architetti','gli','un')];
const CTX=['In un condominio','In una palestra','In una classe','In un ufficio','In un circolo sportivo','In un paese di montagna','In un gruppo di amici','In una squadra di lavoro'];
const SX=1,MX=2,PX=4,REG=[1,2,3,4,5,6,7],LET={1:'S',2:'M',4:'P'};
const has=(m,r)=>(m>>(r-1))&1;
function sat(q,X,Y,m){switch(q){
 case 'A':return REG.every(r=>!(r&X&&!(r&Y))||!has(m,r));
 case 'E':return REG.every(r=>!(r&X&&r&Y)||!has(m,r));
 case 'I':return REG.some(r=>r&X&&r&Y&&has(m,r));
 case 'O':return REG.some(r=>r&X&&!(r&Y)&&has(m,r));}}
const nonEmpty=(t,m)=>REG.some(r=>(r&t)&&has(m,r));
function modelsOf(prems,impo){const out=[];for(let m=0;m<128;m++){
 if(impo&&!(nonEmpty(SX,m)&&nonEmpty(MX,m)&&nonEmpty(PX,m)))continue;
 if(prems.every(p=>sat(p.q,p.X,p.Y,m)))out.push(m);}return out;}
const pop=m=>{let c=0;while(m){c+=m&1;m>>=1;}return c;};
function sTxt(q,X,Y){switch(q){
 case 'A':return `Tutti ${X.art} ${X.p} sono ${Y.p}`;
 case 'E':return `${cap(X.nes)} ${X.s} è ${Y.un} ${Y.s}`;
 case 'I':return `Qualche ${X.s} è ${Y.un} ${Y.s}`;
 case 'O':return `Qualche ${X.s} non è ${Y.un} ${Y.s}`;}}
const sSym=(q,X,Y)=>({A:`Tutti ${LET[X]} sono ${LET[Y]}`,E:`Nessun ${LET[X]} è ${LET[Y]}`,I:`Qualche ${LET[X]} è ${LET[Y]}`,O:`Qualche ${LET[X]} non è ${LET[Y]}`})[q];
const effect=(q,X,Y)=>({A:`la parte di ${LET[X]} fuori da ${LET[Y]} è vuota (tratteggio)`,E:`la parte comune a ${LET[X]} e ${LET[Y]} è vuota (tratteggio)`,I:`nella parte comune a ${LET[X]} e ${LET[Y]} c’è almeno qualcuno (●)`,O:`nella parte di ${LET[X]} fuori da ${LET[Y]} c’è almeno qualcuno (●)`})[q];
const dist=(p,t)=>p.q==='A'?p.X===t:p.q==='E'?(p.X===t||p.Y===t):p.q==='O'?p.Y===t:false;
function sillRules(prems){const r=[];
 if(prems.every(p=>p.q==='I'||p.q==='O'))r.push('Due premesse con «qualche»: non si conclude mai nulla di certo.');
 if(prems.every(p=>p.q==='E'||p.q==='O'))r.push('Due premesse negative: non si conclude nulla.');
 if(!prems.some(p=>dist(p,MX)))r.push('Il termine medio M non è mai preso «tutto intero» (come in «tutti gli M…», «nessun M…» o «… non è un M»): le premesse non collegano davvero S e P.');
 return r;}
function summaryStates(ms){const st={};REG.forEach(r=>{const a=ms.every(m=>has(m,r)),b=ms.every(m=>!has(m,r));st[r]=a?'full':b?'empty':'unk';});return st;}
function modelStates(m){const st={};REG.forEach(r=>st[r]=has(m,r)?'full':'empty');return st;}
function bestModel(ms,pred){const c=ms.filter(pred);if(!c.length)return null;const mn=Math.min(...c.map(pop));return pick(c.filter(m=>pop(m)===mn));}
function sillAnalyze(prems){
 const msI=modelsOf(prems,true),ms0=modelsOf(prems,false);
 const concl=[];
 ['A','E','I','O'].forEach(q=>[[SX,PX],[PX,SX]].forEach(([X,Y])=>{
  const s=m=>sat(q,X,Y,m);
  concl.push({q,X,Y,certI:msI.length>0&&msI.every(s),cert0:ms0.every(s),possI:msI.some(s)});}));
 return{msI,ms0,concl};}
function genSill(){
 for(let tries=0;tries<500;tries++){
  const wantValid=Math.random()<0.6;
  const p1=Math.random()<.5?{q:pick('AEIO'),X:SX,Y:MX}:{q:pick('AEIO'),X:MX,Y:SX};
  const p2=Math.random()<.5?{q:pick('AEIO'),X:MX,Y:PX}:{q:pick('AEIO'),X:PX,Y:MX};
  const prems=[p1,p2];
  const {msI,concl}=sillAnalyze(prems);
  if(!msI.length)continue;
  const valid=concl.filter(c=>c.cert0);
  const amb=concl.filter(c=>c.certI&&!c.cert0);
  const cand=concl.filter(c=>!c.certI);
  if(wantValid&&!valid.length)continue;
  if(!wantValid&&(valid.length||amb.length))continue;
  const need=valid.length?3:4;
  const poss=shuffle(cand.filter(c=>c.possI)),imposs=shuffle(cand.filter(c=>!c.possI));
  const dis=[...poss.slice(0,need),...imposs].slice(0,need);
  if(dis.length<need)continue;
  const idx=shuffle([...Array(SNOUNS.length).keys()]).slice(0,3);
  const T={1:SNOUNS[idx[0]],2:SNOUNS[idx[1]],4:SNOUNS[idx[2]]};
  const ctx=pick(CTX);
  const premTxt=shuffle(prems).map(p=>sTxt(p.q,T[p.X],T[p.Y])+'.');
  let corr=null;
  if(valid.length){const uni=valid.filter(c=>c.q==='A'||c.q==='E');corr=pick(uni.length?uni:valid);}
  const certainSyms=concl.filter(c=>c.cert0).map(c=>sSym(c.q,c.X,c.Y));
  const rules=sillRules(prems);
  const mkC=(c,ok)=>{
   let why,err=null,cex=null;
   if(ok)why=`È vera in tutti i diagrammi compatibili con le premesse (${msI.length} combinazioni di zone vuote/abitate): nessun controesempio.`;
   else if(!c.possI){why='È falsa in ogni diagramma compatibile con le premesse: le contraddice.';err='Hai letto le premesse al contrario (un «sì» al posto di un «no»).';}
   else{why='È possibile, ma non certa: esiste un diagramma che rispetta le premesse in cui è falsa.';
    const swapped=concl.find(d=>d.cert0&&d.q===c.q&&d.X===c.Y&&d.Y===c.X);
    if(c.q==='A'&&swapped)err='Hai girato il «tutti»: «tutti gli S sono P» non dà «tutti i P sono S».';
    else if((c.q==='A'||c.q==='E')&&concl.some(d=>d.cert0&&(d.q==='I'||d.q==='O')))err='Generalizzazione: da un «qualche» non si arriva a un «tutti» o a un «nessuno».';
    else if(rules.length)err=rules[0];
    else err='Hai preso per certa una conclusione solo possibile.';
    cex={f:bestModel(msI,m=>!sat(c.q,c.X,c.Y,m)),t:bestModel(msI,m=>sat(c.q,c.X,c.Y,m))};}
   return{html:sTxt(c.q,T[c.X],T[c.Y])+'.',correct:ok,why,err,cex,sym:sSym(c.q,c.X,c.Y)};};
  const opts=[...(corr?[mkC(corr,true)]:[]),...dis.map(c=>mkC(c,false))];
  const options=[...shuffle(opts),{html:'Nessuna delle conclusioni precedenti è certa.',correct:!corr,
   why:corr?`Falso: la conclusione «${sTxt(corr.q,T[corr.X],T[corr.Y])}» è certa.`:'Giusto: per ognuna delle conclusioni proposte esiste un diagramma compatibile con le premesse in cui è falsa.'+(rules.length?' '+rules.join(' '):''),
   err:corr?'Ti sei fermato prima: la conclusione certa c’era.':null}];
  const termNames=`S = ${T[1].p}, M = ${T[2].p} (il termine medio: compare in entrambe le premesse), P = ${T[4].p}`;
  return{topic:'sill',key:'s'+[p1.q,p1.X,p2.q,p2.X].join('')+idx.join('-'),
   stem:`${ctx} valgono queste due affermazioni:<ul class="prem">${premTxt.map(t=>`<li>${t}</li>`).join('')}</ul>Quale conclusione è certa?`,
   options,
   steps:[`Dai un nome ai gruppi: ${termNames}.`,
    `Premessa «${sSym(p1.q,p1.X,p1.Y)}»: ${effect(p1.q,p1.X,p1.Y)}.`,
    `Premessa «${sSym(p2.q,p2.X,p2.Y)}»: ${effect(p2.q,p2.X,p2.Y)}.`,
    `Si assume che ogni gruppo nominato abbia almeno un elemento. Le zone bianche con «?» possono essere vuote o abitate: se il ● può cadere in due zone, non sappiamo in quale.`,
    `Una conclusione è certa solo se nessun diagramma compatibile la rende falsa. ${certainSyms.length?'Certe (fra S e P): '+certainSyms.join('; ')+'.':'Qui nessuna conclusione fra S e P è certa.'}`,
    ...(corr?[]:rules),
    `Risposta: ${corr?sTxt(corr.q,T[corr.X],T[corr.Y])+'.':'nessuna delle conclusioni proposte è certa.'}`],
   fig:{type:'venn',states:summaryStates(msI),terms:T,caption:'Diagramma riassuntivo delle premesse: tratteggio = zona vuota, ● = zona sicuramente abitata, ? = non si sa.'}};
 }
 throw new Error('genSill: nessun esercizio valido');
}

 3:{w:300,h:268,c:[{cx:112,cy:100,r:76},{cx:150,cy:166,r:76},{cx:188,cy:100,r:76}],lab:[[30,30],[150,262],[270,30]]},

function centroids(cfg){if(cfg.cent)return cfg.cent;const acc={};
 for(let x=0;x<cfg.w;x+=2)for(let y=0;y<cfg.h;y+=2){let r=0;cfg.c.forEach((c,i)=>{if((x-c.cx)**2+(y-c.cy)**2<(c.r-6)**2)r|=1<<i;});if(!r)continue;(acc[r]=acc[r]||[]).push([x,y]);}

/* ================= IMPARA ================= */
const THEORY={
 imp:{t:'Implicazione A ⇒ B',pts:[
  '«Se A, allora B» è falsa in un solo caso: A vera e B falsa.',
  'Da A ⇒ B si deduce solo la contronominale ¬B ⇒ ¬A: si scambiano le parti e si negano entrambe.',
  'Non si deducono l’inversa (B ⇒ A) né la contraria (¬A ⇒ ¬B). Tra loro sono equivalenti, ma diverse dalla frase.',
  'La negazione di «se A allora B» è «A e non B».',
  'Disegno: A è un cerchio tutto dentro B. Il controesempio di inversa e contraria è la zona «B senza A».']},
 cns:{t:'Condizione necessaria e sufficiente',pts:[
  'In A ⇒ B: A è condizione sufficiente per B; B è condizione necessaria per A.',
  'Introducono la sufficiente (A ⇒ B): «se A, B», «B se A», «basta che A», «è sufficiente che A», «ogni volta che A».',
  'Introducono la necessaria: «A solo se B», «condizione necessaria perché A è che B», «A, a patto che B». In tutti i casi resta A ⇒ B.',
  '«A se e solo se B» = A ⇔ B: necessaria e sufficiente insieme.',
  'Trucco: la sufficiente è il cerchio piccolo, la necessaria quello grande che lo contiene.',
  'Qui «a patto che» si legge come «solo se». Nel parlato può suonare come «se e solo se»: se vuoi, escludilo dagli esercizi in «Allenati».']},
 quant:{t:'Negazione dei quantificatori',pts:[
  'Negare vuol dire smentire: la negazione è vera esattamente quando la frase è falsa.',
  '«Tutti … sono» si nega con «almeno uno (qualche) … non è», cioè «non tutti … sono».',
  '«Nessuno … è» si nega con «almeno uno (qualche) … è».',
  '«Nessuno» non è la negazione di «tutti»: è il contrario. Possono essere false insieme.',
  'In logica «qualche» = «almeno uno»: anche uno solo, magari tutti.',
  'Evita «tutti … non …»: in italiano è ambigua, per questo qui non compare.']},
 sill:{t:'Sillogismi',pts:[
  'Disegna tre insiemi S, M, P. Tratteggia le zone che le premesse dicono vuote, metti ● dove dicono che c’è qualcuno.',
  'Una conclusione è certa solo se è vera in tutti i diagrammi compatibili. Basta un diagramma compatibile in cui è falsa per scartarla.',
  'Si assume che ogni gruppo nominato abbia almeno un elemento.',
  'Regole veloci: due premesse con «qualche» o due premesse negative non danno mai una conclusione certa.',
  'Il termine medio M deve essere preso «tutto intero» almeno una volta: «tutti gli M…», «nessun M…» oppure «… non è un M».',
  'Valido: tutti A sono B + tutti B sono C ⇒ tutti A sono C. Non valido: tutti A sono B + qualche B è C.']}};

/* --- widget condizioni --- */
function cnsWidget(el){

  const x=st.swap?L('B'):L('A'),y=st.swap?L('A'):L('B'),s=inst(p,t,x,y);

  const out=isIff?`<p>Formula: <span class="sym">${sym(s.f)}</span>. «${clauseOf(p,x).i}» è condizione <b>necessaria e sufficiente</b> per «${clauseOf(p,y).i}» (e viceversa).</p>`
   :`<p>Formula: <span class="sym">${sym(s.f)}</span></p><p>Condizione <b>sufficiente</b>: «${clauseOf(p,s.f.x).i}» (cerchio piccolo)</p><p>Condizione <b>necessaria</b>: «${clauseOf(p,s.f.y).i}» (cerchio grande)</p>`;
  el.innerHTML=`<div class="row2"><label class="field">Costruzione<select id="cwt">${TPL.map((q,i)=>`<option value="${i}"${i===st.ti?' selected':''}>${q.lab}</option>`).join('')}</select></label>
  <label class="field">Esempio<select id="cwp">${PAIRS.map((q,i)=>`<option value="${i}"${i===st.pi?' selected':''}>${q.a.i} / ${q.b.i}</option>`).join('')}</select></label></div>
  <button class="btn small" id="cws">Scambia A e B nella frase</button>
  <p class="big"><q>${s.txt}</q></p>${pairLegend(p)}
  <div class="panel"><p>${hintFor(p,t,x,y)}</p>${out}</div>
  <div class="figwrap">${implSvg({inner:symL(s.f.x),outer:symL(s.f.y),iff:isIff})}</div>`;
  $('#cwt',el).onchange=e=>{st.ti=+e.target.value;draw();};
  $('#cwp',el).onchange=e=>{st.pi=+e.target.value;draw();};

 draw();}

/* --- widget sillogismi --- */
function sillWidget(el){
 const st={q1:'A',o1:'SM',q2:'A',o2:'MP',idx:shuffle([...Array(SNOUNS.length).keys()]).slice(0,3),view:'sum',model:0,mi:0};
 const QL={A:'Tutti … sono …',E:'Nessun … è …',I:'Qualche … è …',O:'Qualche … non è …'};
 const draw=()=>{
  const T={1:SNOUNS[st.idx[0]],2:SNOUNS[st.idx[1]],4:SNOUNS[st.idx[2]]};
  const p1=st.o1==='SM'?{q:st.q1,X:SX,Y:MX}:{q:st.q1,X:MX,Y:SX},p2=st.o2==='MP'?{q:st.q2,X:MX,Y:PX}:{q:st.q2,X:PX,Y:MX},prems=[p1,p2];
  const {msI,concl}=sillAnalyze(prems);
  const mins=msI.filter(m=>!msI.some(k=>k!==m&&(k&m)===k)).sort((a,b)=>pop(a)-pop(b));
  const list=concl.filter(c=>!((c.q==='E'||c.q==='I')&&c.X===PX));
  let diag,status='';
  if(st.view==='sum'){diag=vennSvg(3,summaryStates(msI),['S','M','P'],{click:true});status='Riassunto: quello che le premesse dicono di sicuro. Tocca una zona per passare a un diagramma concreto.';}
  else{const m=st.model;diag=vennSvg(3,modelStates(m),['S','M','P'],{click:true,noQ:true});
   const okP=prems.map(p=>sat(p.q,p.X,p.Y,m)),ne=[SX,MX,PX].every(t=>nonEmpty(t,m));
   status=`Diagramma concreto. Premessa 1 ${okP[0]?'rispettata':'<b class="ko">non rispettata</b>'}; premessa 2 ${okP[1]?'rispettata':'<b class="ko">non rispettata</b>'}; gruppi non vuoti: ${ne?'sì':'<b class="ko">no</b>'}. Tocca le zone per cambiarle.`;}
  const lab=c=>c.certI?'<span class="badge b-ok">certa</span>':c.possI?'<span class="badge b-mid">possibile</span>':'<span class="badge b-ko">impossibile</span>';
  el.innerHTML=`<div class="row2"><div><p class="pt">Premessa 1</p><select id="sq1">${'AEIO'.split('').map(q=>`<option value="${q}"${q===st.q1?' selected':''}>${QL[q]}</option>`).join('')}</select>
   <select id="so1"><option value="SM"${st.o1==='SM'?' selected':''}>soggetto S, poi M</option><option value="MS"${st.o1==='MS'?' selected':''}>soggetto M, poi S</option></select></div>
   <div><p class="pt">Premessa 2</p><select id="sq2">${'AEIO'.split('').map(q=>`<option value="${q}"${q===st.q2?' selected':''}>${QL[q]}</option>`).join('')}</select>
   <select id="so2"><option value="MP"${st.o2==='MP'?' selected':''}>soggetto M, poi P</option><option value="PM"${st.o2==='PM'?' selected':''}>soggetto P, poi M</option></select></div></div>
  <ol class="prem2"><li>${sTxt(p1.q,T[p1.X],T[p1.Y])}. <span class="sym">${sSym(p1.q,p1.X,p1.Y)}</span></li><li>${sTxt(p2.q,T[p2.X],T[p2.Y])}. <span class="sym">${sSym(p2.q,p2.X,p2.Y)}</span></li></ol>
  ${termLegend(T)}<button class="btn small" id="snew">Altre parole</button>
  <div class="figwrap narrow">${diag}</div>${VLEG}<p class="small">${status}</p>
  <div class="btnrow"><button class="btn small" id="ssum"${st.view==='sum'?' disabled':''}>Riassunto delle premesse</button><button class="btn small" id="smod">Un diagramma possibile (${mins.length?((st.mi%mins.length)+1)+' di '+mins.length:'0'})</button></div>
  <h3>Conclusioni fra S e P</h3><ul class="vf concl">${list.map((c,i)=>`<li>${lab(c)} ${sTxt(c.q,T[c.X],T[c.Y])}.${st.view==='model'?` <span class="small">(qui: ${sat(c.q,c.X,c.Y,st.model)?'vera':'falsa'})</span>`:''}${c.possI&&!c.certI?` <button class="link" data-c="${i}">controesempio</button>`:''}</li>`).join('')}</ul>
  ${(()=>{const r=sillRules(prems);return r.length?`<p class="note">${r.join(' ')}</p>`:'';})()}`;
  const set=(k,v)=>{st[k]=v;st.view='sum';st.mi=0;draw();};
  $('#sq1',el).onchange=e=>set('q1',e.target.value);$('#so1',el).onchange=e=>set('o1',e.target.value);
  $('#sq2',el).onchange=e=>set('q2',e.target.value);$('#so2',el).onchange=e=>set('o2',e.target.value);
  $('#snew',el).onclick=()=>{st.idx=shuffle([...Array(SNOUNS.length).keys()]).slice(0,3);draw();};
  $('#ssum',el).onclick=()=>{st.view='sum';draw();};
  $('#smod',el).onclick=()=>{if(!mins.length)return;if(st.view==='model')st.mi++;st.view='model';st.model=mins[st.mi%mins.length];draw();};
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=list[+b.dataset.c];st.view='model';st.model=bestModel(msI,m=>!sat(c.q,c.X,c.Y,m));draw();});
  const svg=$('svg.venn',el);svg.onclick=e=>{const r=vennRegion(svg,e,3);if(!r)return;
   if(st.view==='sum'){st.model=mins.length?mins[0]:127;st.view='model';}
   st.model^=1<<(r-1);draw();};};
 draw();}

function guided(el,topic){

  el.innerHTML=`<div class="stem">${ex.stem}</div><ol class="opts static">${ex.options.map((o,i)=>`<li class="${done&&o.correct?'is-ok':''}"><span class="lt">${L5[i]}</span><span>${o.html}</span></li>`).join('')}</ol>
  <ol class="steps">${ex.steps.slice(0,k).map(s=>`<li>${s}</li>`).join('')}</ol>
  ${done?`<div class="revbox">${reviewHtml(ex,-1).replace(/<h3>Svolgimento<\/h3><ol class="steps">[\s\S]*?<\/ol>/,'')}</div>`:''}
  <div class="btnrow">${done?'':`<button class="btn primary" id="gnext">Passo successivo (${k+1} di ${ex.steps.length})</button>`}<button class="btn" id="gnew">Nuovo esempio</button></div>`;

 main.querySelectorAll('[data-top]').forEach(c=>c.onchange=()=>s.topics[c.dataset.top]=c.checked);
 main.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{s.n=+b.dataset.n;main.querySelectorAll('[data-n]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
 $('#tmr').onchange=e=>{s.timer=e.target.checked;$('#mins').disabled=!s.timer;};
 $('#mins').onchange=e=>{s.minutes=Math.max(1,Math.min(120,+e.target.value||20));e.target.value=s.minutes;};
 $('#patto').onchange=e=>s.patto=e.target.checked;

let TICK=null;
function startQuiz(tops){
 OPT.patto=S.set.patto;
 const order=[];while(order.length<S.set.n)order.push(...shuffle(tops));
 S.quiz={order:order.slice(0,S.set.n),i:0,items:[],seen:new Set(),left:S.set.timer?S.set.minutes*60:null,over:false};
 nextQuestion();
 clearInterval(TICK);
 if(S.quiz.left!==null)TICK=setInterval(()=>{const q=S.quiz;if(!q||q.over){clearInterval(TICK);return;}q.left--;const t=$('#clock');if(t){t.textContent=clock(q.left);t.classList.toggle('low',q.left<=60);}if(q.left<=0){clearInterval(TICK);endQuiz(true);}},1000);
 render();}
const clock=s=>`${Math.floor(Math.max(0,s)/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
function nextQuestion(){const q=S.quiz,t=q.order[q.i];let ex;
 for(let k=0;k<40;k++){ex=GEN[t]();if(!q.seen.has(ex.key))break;}
 q.seen.add(ex.key);q.items.push({ex,ch:null,done:false});}
function score(q){let ok=0,ko=0,bl=0;q.items.forEach(it=>{if(!it.done)return;if(it.ch===-1)bl++;else if(it.ex.options[it.ch].correct)ok++;else ko++;});return{ok,ko,bl,pts:ok-0.25*ko};}
function renderQuestion(main){const q=S.quiz,it=q.items[q.i],ex=it.ex,sc=score(q);
 main.innerHTML=`<div class="bar"><span>Domanda <b>${q.i+1}</b> di ${q.order.length}</span><span>Punti <b>${fmt(sc.pts)}</b></span>${q.left!==null?`<span>Tempo <b id="clock" class="${q.left<=60?'low':''}">${clock(q.left)}</b></span>`:''}<button class="link" id="quit">Termina</button></div>
 <section class="card"><p class="topic-tag">${TOPICS[ex.topic]}</p><div class="stem">${ex.stem}</div>
 <ol class="opts">${ex.options.map((o,i)=>{let c='';if(it.done){if(o.correct)c='is-ok';else if(i===it.ch)c='is-ko';}
  return `<li><button class="opt ${c}" data-i="${i}"${it.done?' disabled':''}><span class="lt">${L5[i]}</span><span>${o.html}</span></button></li>`;}).join('')}</ol>
 ${it.done?'':'<button class="btn" id="skip">Non rispondo (0 punti)</button>'}
 <div id="fb"></div></section>`;
 main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 const sk=$('#skip');if(sk)sk.onclick=()=>answer(-1);
 $('#quit').onclick=()=>endQuiz(false);
 if(it.done)showFeedback();}
function answer(i){const q=S.quiz,it=q.items[q.i];if(it.done)return;it.ch=i;it.done=true;renderQuestion($('#main'));
 const fb=$('#fb');if(fb)fb.scrollIntoView({behavior:'auto',block:'start'});}
function showFeedback(){const q=S.quiz,it=q.items[q.i],ex=it.ex,fb=$('#fb');
 const ok=it.ch>=0&&ex.options[it.ch].correct,ci=ex.options.findIndex(o=>o.correct);
 const v=it.ch===-1?`<div class="verdict blank">Non hai risposto: 0 punti. La giusta era la ${L5[ci]}.</div>`:ok?`<div class="verdict good">Giusto: +1</div>`:`<div class="verdict bad">Sbagliato: −0,25. La giusta era la ${L5[ci]}.</div>`;
 const last=q.i===q.order.length-1;
 fb.innerHTML=v+reviewHtml(ex,it.ch)+`<button class="btn primary big" id="next">${last?'Vedi il riepilogo':'Domanda successiva'}</button>`;
 bindReview(fb,ex);
 $('#next').onclick=()=>{if(last)endQuiz(false);else{q.i++;nextQuestion();renderQuestion($('#main'));window.scrollTo(0,0);}};}
function endQuiz(timeUp){const q=S.quiz;if(!q||q.over)return;q.over=true;q.timeUp=timeUp;clearInterval(TICK);
 const it=q.items[q.i];if(it&&!it.done){q.items.pop();}
 render();}
function renderSummary(main){const q=S.quiz,sc=score(q),tot=q.order.length,unseen=tot-q.items.length;
 const bl=sc.bl+unseen;
 const per={};q.items.forEach(it=>{const t=it.ex.topic;per[t]=per[t]||{ok:0,ko:0,bl:0};if(it.ch===-1)per[t].bl++;else if(it.ex.options[it.ch].correct)per[t].ok++;else per[t].ko++;});
 main.innerHTML=`<section class="card"><h2>${q.timeUp?'Tempo scaduto':'Riepilogo'}</h2>
 <p class="score"><b>${fmt(sc.pts)}</b> punti su ${tot}</p>
 <p>Giuste ${sc.ok} · sbagliate ${sc.ko} · non date ${bl}${unseen?` (di cui ${unseen} non viste)`:''}</p>
 <div class="tt-wrap"><table class="tt"><thead><tr><th>Argomento</th><th>Giuste</th><th>Sbagliate</th><th>Vuote</th><th>Punti</th></tr></thead><tbody>
 ${Object.entries(per).map(([t,v])=>`<tr><td>${TOPICS[t]}</td><td>${v.ok}</td><td>${v.ko}</td><td>${v.bl}</td><td>${fmt(v.ok-0.25*v.ko)}</td></tr>`).join('')}</tbody></table></div>
 <h3>Le tue risposte</h3><ol class="hist">${q.items.map((it,i)=>{const ci=it.ex.options.findIndex(o=>o.correct);const r=it.ch===-1?'non data':it.ex.options[it.ch].correct?'giusta':'sbagliata';
  return `<li><details><summary><span class="badge ${r==='giusta'?'b-ok':r==='sbagliata'?'b-ko':'b-mid'}">${r}</span> ${TOPICS[it.ex.topic]}: tua ${it.ch===-1?'—':L5[it.ch]}, giusta ${L5[ci]}</summary><div class="stem">${it.ex.stem}</div><div class="hrev" data-h="${i}"></div></details></li>`;}).join('')}</ol>
 <div class="btnrow"><button class="btn primary big" id="again">Nuovo allenamento</button></div></section>`;
 main.querySelectorAll('details').forEach(d=>d.ontoggle=()=>{const box=$('.hrev',d);if(d.open&&!box.dataset.on){const it=q.items[+box.dataset.h];box.dataset.on=1;box.innerHTML=reviewHtml(it.ex,it.ch);bindReview(box,it.ex);}});
 $('#again').onclick=()=>{S.quiz=null;render();};}

document.addEventListener('keydown',e=>{
 if(S.mode!=='practice'||!S.quiz||S.quiz.over)return;
 if(e.target.matches('input,select,textarea'))return;
 const it=S.quiz.items[S.quiz.i];
 if(!it.done){const k=e.key.toUpperCase();let i=L5.indexOf(k);if(i<0&&/^[1-5]$/.test(e.key))i=+e.key-1;if(i>=0&&i<it.ex.options.length){e.preventDefault();answer(i);}}
 else if(e.key==='Enter'){const n=$('#next');if(n&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();n.click();}}});
document.querySelectorAll('.modetab').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render();});
render();
</script></body></html>
